name: Build MailCraft images

# Builds both MailCraft images for x86 (amd64) and ARM (arm64) and publishes them to GitHub's
# container registry:
#   mailcraft-neko     -> homelab-mailcraft/        (streams with Neko, plain HTTP)
#   mailcraft-selkies  -> homelab-mailcraft-https/  (streams with Selkies, needs umbrelOS HTTPS)
# then writes the new images and version into both apps so Umbrel offers the update.

on:
  workflow_dispatch:
    inputs:
      mailcraft_ref:
        description: MailCraft tag, branch or commit to build (empty = newest release)
        required: false
        default: ""
  schedule:
    # Mondays: build only if MailCraft has a release newer than the one in the app.
    - cron: "17 9 * * 1"

permissions:
  contents: write
  packages: write

concurrency:
  group: build-mailcraft
  cancel-in-progress: false

env:
  APP_DIR: homelab-mailcraft
  HTTPS_APP_DIR: homelab-mailcraft-https
  MAILCRAFT_REPO: https://github.com/UCS-Care-Group/mailcraft

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      registry: ${{ steps.plan.outputs.registry }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        env:
          INPUT_REF: ${{ inputs.mailcraft_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-}"
          if [ -z "$ref" ]; then
            ref=$(git ls-remote --tags --refs "$MAILCRAFT_REPO" \
              | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          [ -n "$ref" ] || { echo "no MailCraft release found" >&2; exit 1; }

          current=$(sed -n 's/^version: "\(.*\)"/\1/p' "$APP_DIR/umbrel-app.yml")
          if [[ "$ref" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            base="${BASH_REMATCH[1]}"
          else
            base="0.0.0-$(echo "$ref" | tr -c 'A-Za-z0-9\n' '-' | cut -c1-40)"
          fi

          build=true
          version="$base"
          if [ "${current%%-r*}" = "$base" ]; then
            if [ "$EVENT" = "schedule" ]; then
              build=false
            else
              # Same MailCraft version built again: a new number so Umbrel sees an update.
              version="$base-r${GITHUB_RUN_NUMBER}"
            fi
          fi

          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "ref=$ref"
            echo "version=$version"
            echo "registry=$registry"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "MailCraft $ref -> $registry/mailcraft-{neko,selkies}:$version (build: $build, app now at $current)"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # The Google values are optional repository secrets (Settings > Secrets > Actions), for
      # "Sign in with Google". They end up inside the program, as in any desktop mail app.
      BUILD_ARGS: |
        MAILCRAFT_REF=${{ needs.prepare.outputs.ref }}
        MAILCRAFT_GOOGLE_CLIENT_ID=${{ secrets.MAILCRAFT_GOOGLE_CLIENT_ID }}
        MAILCRAFT_GOOGLE_CLIENT_SECRET=${{ secrets.MAILCRAFT_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images share the same MailCraft build stage: the second build reuses it from the
      # builder's cache, so MailCraft is compiled once per architecture.
      - id: neko
        uses: docker/build-push-action@v6
        with:
          context: images
          file: images/neko/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ env.BUILD_ARGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=MailCraft streamed to the browser with Neko
          outputs: type=image,name=${{ needs.prepare.outputs.registry }}/mailcraft-neko,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - id: selkies
        uses: docker/build-push-action@v6
        with:
          context: images
          file: images/selkies/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ env.BUILD_ARGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=MailCraft streamed to the browser with Selkies
          outputs: type=image,name=${{ needs.prepare.outputs.registry }}/mailcraft-selkies,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}

      - name: Save digests
        env:
          NEKO_DIGEST: ${{ steps.neko.outputs.digest }}
          SELKIES_DIGEST: ${{ steps.selkies.outputs.digest }}
        run: |
          mkdir -p /tmp/digests/neko /tmp/digests/selkies
          touch "/tmp/digests/neko/${NEKO_DIGEST#sha256:}" "/tmp/digests/selkies/${SELKIES_DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: manifest
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for name in neko selkies; do
            image="$REGISTRY/mailcraft-$name"
            cd "/tmp/digests/$name"
            # shellcheck disable=SC2046
            docker buildx imagetools create -t "$image:$VERSION" -t "$image:latest" \
              $(printf "$image@sha256:%s " *)
            digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' \
              | jq -r .digest)
            echo "$name=$digest" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/checkout@v4

      - name: Point the Umbrel apps at the new images
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REF: ${{ needs.prepare.outputs.ref }}
          NEKO_DIGEST: ${{ steps.manifest.outputs.neko }}
          SELKIES_DIGEST: ${{ steps.manifest.outputs.selkies }}
        run: |
          set -euo pipefail
          update() { # app folder, image name, digest
            local dir=$1 image="$REGISTRY/$2" digest=$3
            sed -i -E "s#^( +image: ).*/$2:.*#\1$image:$VERSION@$digest#" "$dir/docker-compose.yml"
            sed -i -E "s#^version: \".*\"#version: \"$VERSION\"#" "$dir/umbrel-app.yml"
            notes="Built from MailCraft $REF. See https://github.com/UCS-Care-Group/mailcraft/releases"
            sed -i -E "/^releaseNotes:/{n;s#^  .*#  $notes#}" "$dir/umbrel-app.yml"
          }
          update "$APP_DIR" mailcraft-neko "$NEKO_DIGEST"
          update "$HTTPS_APP_DIR" mailcraft-selkies "$SELKIES_DIGEST"
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "MailCraft $VERSION"
          git push
