[program:mailcraft]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/local/bin/mailcraft-session
directory=/home/%(ENV_USER)s
stopsignal=TERM
stopasgroup=true
killasgroup=true
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/mailcraft.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:address-watch]
command=/usr/local/bin/mailcraft-address-watch
autorestart=true
priority=900
user=root
stdout_logfile=/var/log/neko/address-watch.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
