manifestVersion: 1
id: kyle-opengym
storage:
  dataRoot: data
environment:
  - name: ORIGIN
    services:
      - api
    default: "http://umbrel.local:18090"
    note: >-
      The exact address you open openGym at, with no trailing slash, such as
      http://umbrel:18090 for your Umbrel's Tailscale (MagicDNS) name. Sign-ins are
      accepted only from this address. Set RP_ID to the same host, then restart the app.
  - name: RP_ID
    services:
      - api
    default: "umbrel.local"
    note: >-
      The host name in ORIGIN, with no http:// and no port, such as umbrel.
      Passkeys (HTTPS only) belong to it, so changing it later makes existing passkeys stop
      working.
  - name: PASSWORD_LOGIN
    services:
      - api
    default: "1"
    options:
      - "1"
      - "0"
    note: >-
      1 allows signing in with your profile name and a password, next to passkeys. Before
      setting 0, add a passkey to every profile that only has a password.
  - name: INVITE_ONLY
    services:
      - api
    default: "1"
    options:
      - "1"
      - "0"
    note: >-
      1 means new profiles need an invite code from the admin dashboard. 0 lets anyone who
      can reach openGym create a profile.
  - name: ALLOW_GUEST
    services:
      - api
    default: "0"
    options:
      - "0"
      - "1"
    note: >-
      1 shows "Continue without account", which keeps data only in that browser.
category: files
name: openGym
version: "1.4.5"
tagline: Self-hosted gym tracker for workouts, routines and body weight
description: >-
  **First run:** set ORIGIN and RP_ID in this app's settings to the address you'll use (such
  as your Umbrel's Tailscale name: http://umbrel:18090 and umbrel) and restart the app. Then
  open that address, choose Create new profile, use a password, and paste the password shown on
  this page as the invite code. That first profile becomes the admin, and the code stops
  working once it's used. Steps are in the store's README.


  Over plain http you sign in with a name and password. Passkeys, offline use, notifications
  and the iPhone app need HTTPS.


  openGym plans routines, logs workouts (supersets and cardio too), and tracks your body
  weight and progress. Each profile's data stays on your Umbrel and syncs between your
  devices. The AI Coach is off and needs an admin to set it up.


  Back up the app data folder data/opengym: it holds every profile and workout.


  This is a community package. It is not made or endorsed by the openGym project.
releaseNotes: ""

developer: Duarte Santos
website: https://opengym.ch
dependencies: []
repo: https://github.com/DuarteSantos8/openGym
support: https://github.com/DuarteSantos8/openGym/issues

port: 18090
gallery: []
path: ""
icon: https://raw.githubusercontent.com/kyleken/umbrel-apps/main/kyle-opengym/icon.png

defaultUsername: ""
deterministicPassword: true

submitter: kyleken
submission: https://github.com/kyleken/umbrel-apps
