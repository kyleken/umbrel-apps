<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <clipPath id="base"><rect x="0" y="0" width="256" height="206"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- kettlebell handle: a wide arch whose feet sink into the bell -->
  <path d="M80 132 C70 96 70 60 128 60 C186 60 186 96 176 132" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
  <!-- kettlebell bell: a ball with a flat base -->
  <circle cx="128" cy="150" r="62" fill="#fff" clip-path="url(#base)"/>
  <!-- progress chevron on the bell -->
  <path d="M102 170 L128 144 L154 170" fill="none" stroke="#c2410c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
